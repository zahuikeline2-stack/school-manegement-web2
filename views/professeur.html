<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>School Manager - Professeurs</title>

    <link rel="stylesheet" href="./css/professeur.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>

<body>

    <!-- =========================
         BARRE LATERALE
    ========================== -->

    <aside class="Barre">

        <h2>School Manager</h2>

        <nav>

            <a href="/admin">
                <i class="fa-solid fa-house"></i>
                <span>Accueil</span>
            </a>

            <a href="/users">
                <i class="fa-solid fa-user"></i>
                <span>Utilisateurs</span>
            </a>

            <a href="/etudiants">
                <i class="fa-solid fa-user-graduate"></i>
                <span>Étudiants</span>
            </a>

            <a href="/professeurs" class="active">
                <i class="fa-solid fa-chalkboard-user"></i>
                <span>Professeurs</span>
            </a>

            <a href="/matieres">
                <i class="fa-solid fa-book"></i>
                <span>Matières</span>
            </a>

            <a href="/notes">
                <i class="fa-solid fa-clipboard-list"></i>
                <span>Notes</span>
            </a>

            <a href="/absences">
                <i class="fa-solid fa-calendar-xmark"></i>
                <span>Absences</span>
            </a>

            <a href="/statistiques">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Statistiques</span>
            </a>

        </nav>

        <a href="/login" id="deconnecter">

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>Déconnexion</span>

        </a>

    </aside>


    <!-- =========================
         CONTENU
    ========================== -->

    <main class="content">

        <div class="page-header">

            <div>

                <h1>Gestion des professeurs</h1>

                <p>
                    Ajouter, rechercher, modifier et supprimer
                    les professeurs.
                </p>

            </div>

            <button
                id="btnRetour"
                class="btn-retour"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Retour au menu

            </button>

        </div>


        <!-- ACTIONS -->

        <div class="actions">

            <button
                id="btnAjouter"
                class="action-card"
            >

                <i class="fa-solid fa-user-plus"></i>

                <div>

                    <h3>Ajouter</h3>

                    <p>
                        Ajouter un professeur
                    </p>

                </div>

            </button>


            <button
                id="btnLister"
                class="action-card"
            >

                <i class="fa-solid fa-list"></i>

                <div>

                    <h3>Liste</h3>

                    <p>
                        Voir les professeurs
                    </p>

                </div>

            </button>


            <button
                id="btnRechercher"
                class="action-card"
            >

                <i class="fa-solid fa-magnifying-glass"></i>

                <div>

                    <h3>Rechercher</h3>

                    <p>
                        Rechercher un professeur
                    </p>

                </div>

            </button>

        </div>


        <!-- =========================
             FORMULAIRE
        ========================== -->

        <section
            id="formulaireSection"
            class="section"
        >

            <h2 id="formTitle">
                Ajouter un professeur
            </h2>


            <form id="professeurForm">

                <input
                    type="hidden"
                    id="professeurId"
                >


                <div class="form-group">

                    <label for="nom">
                        Nom du professeur
                    </label>

                    <input
                        type="text"
                        id="nom"
                        placeholder="Ex : Koffi Jean"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="matiere">
                        Matière
                    </label>

                    <input
                        type="text"
                        id="matiere"
                        placeholder="Ex : Mathématiques"
                        required
                    >

                </div>


                <div class="form-buttons">

                    <button
                        type="submit"
                        id="btnEnregistrer"
                        class="btn-primary"
                    >

                        <i class="fa-solid fa-check"></i>

                        Enregistrer

                    </button>


                    <button
                        type="button"
                        id="btnAnnuler"
                        class="btn-secondary"
                    >

                        Annuler

                    </button>

                </div>

            </form>

        </section>


        <!-- =========================
             RECHERCHE
        ========================== -->

        <section
            id="rechercheSection"
            class="section"
        >

            <h2>Rechercher un professeur</h2>

            <div class="search-box">

                <input
                    type="number"
                    id="recherche"
                    placeholder="ID du professeur"
                >

                <button
                    id="btnLancerRecherche"
                    class="btn-primary"
                >

                    <i class="fa-solid fa-search"></i>

                    Rechercher

                </button>

            </div>

        </section>


        <!-- =========================
             LISTE
        ========================== -->

        <section
            id="listeSection"
            class="section"
        >

            <h2>Liste des professeurs</h2>

            <div id="professeursList"></div>

        </section>

    </main>


    <script src="/js/professeur.js"></script>

</body>

</html>

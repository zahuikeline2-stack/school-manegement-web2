<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>School Manager - Notes</title>

    <link
        rel="stylesheet"
        href="/css/notes.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>


<body>


    <!-- =========================
         BARRE LATERALE
    ========================== -->

    <aside class="Barre">

        <h2>School Manager</h2>

        <nav>

            <a href="/admin">
                <i class="fa-solid fa-house"></i>
                <span>Accueil</span>
            </a>

            <a href="/users">
                <i class="fa-solid fa-user"></i>
                <span>Utilisateurs</span>
            </a>

            <a href="/etudiants">
                <i class="fa-solid fa-user-graduate"></i>
                <span>Étudiants</span>
            </a>

            <a href="/professeurs">
                <i class="fa-solid fa-chalkboard-user"></i>
                <span>Professeurs</span>
            </a>

            <a href="/matieres">
                <i class="fa-solid fa-book"></i>
                <span>Matières</span>
            </a>

            <a href="/notes" class="active">
                <i class="fa-solid fa-clipboard-list"></i>
                <span>Notes</span>
            </a>

            <a href="/absences">
                <i class="fa-solid fa-calendar-xmark"></i>
                <span>Absences</span>
            </a>

            <a href="/statistiques">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Statistiques</span>
            </a>

        </nav>


        <a href="/login" id="deconnecter">

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>Déconnexion</span>

        </a>

    </aside>



    <!-- =========================
         CONTENU
    ========================== -->

    <main class="content">


        <div class="page-header">

            <div>

                <h1>Gestion des notes</h1>

                <p>
                    Ajouter, modifier, supprimer et calculer
                    les moyennes des étudiants.
                </p>

            </div>


            <button
                id="btnRetour"
                class="btn-retour"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Retour au menu

            </button>

        </div>



        <!-- =========================
             ACTIONS
        ========================== -->

        <div class="actions">


            <button
                id="btnAjouter"
                class="action-card"
            >

                <i class="fa-solid fa-plus"></i>

                <div>

                    <h3>Ajouter</h3>

                    <p>
                        Ajouter une note
                    </p>

                </div>

            </button>



            <button
                id="btnLister"
                class="action-card"
            >

                <i class="fa-solid fa-list"></i>

                <div>

                    <h3>Lister</h3>

                    <p>
                        Voir les notes
                    </p>

                </div>

            </button>



            <button
                id="btnModifier"
                class="action-card"
            >

                <i class="fa-solid fa-pen"></i>

                <div>

                    <h3>Modifier</h3>

                    <p>
                        Modifier une note
                    </p>

                </div>

            </button>



            <button
                id="btnSupprimer"
                class="action-card"
            >

                <i class="fa-solid fa-trash"></i>

                <div>

                    <h3>Supprimer</h3>

                    <p>
                        Supprimer une note
                    </p>

                </div>

            </button>



            <button
                id="btnMoyenne"
                class="action-card"
            >

                <i class="fa-solid fa-calculator"></i>

                <div>

                    <h3>Moyenne</h3>

                    <p>
                        Calculer la moyenne
                    </p>

                </div>

            </button>

        </div>



        <!-- =========================
             AJOUTER
        ========================== -->

        <section
            id="ajouterSection"
            class="section"
        >

            <h2>Ajouter une note</h2>


            <form id="noteForm">

                <div class="form-group">

                    <label for="student_id">
                        ID de l'étudiant
                    </label>

                    <input
                        type="number"
                        id="student_id"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="subject_id">
                        ID de la matière
                    </label>

                    <input
                        type="number"
                        id="subject_id"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="note">
                        Note / 20
                    </label>

                    <input
                        type="number"
                        id="note"
                        min="0"
                        max="20"
                        step="0.01"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-primary"
                >

                    <i class="fa-solid fa-check"></i>

                    Ajouter la note

                </button>

            </form>

        </section>



        <!-- =========================
             LISTER
        ========================== -->

        <section
            id="listeSection"
            class="section"
        >

            <h2>Notes d'un étudiant</h2>


            <div class="search-box">

                <input
                    type="number"
                    id="studentListe"
                    placeholder="ID de l'étudiant"
                >

                <button
                    id="btnChargerNotes"
                    class="btn-primary"
                >

                    <i class="fa-solid fa-list"></i>

                    Afficher

                </button>

            </div>


            <div id="notesList"></div>

        </section>



        <!-- =========================
             MODIFIER
        ========================== -->

        <section
            id="modifierSection"
            class="section"
        >

            <h2>Modifier une note</h2>


            <form id="modifierForm">

                <div class="form-group">

                    <label>
                        ID étudiant
                    </label>

                    <input
                        type="number"
                        id="modifierStudent"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        ID matière
                    </label>

                    <input
                        type="number"
                        id="modifierSubject"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Nouvelle note
                    </label>

                    <input
                        type="number"
                        id="nouvelleNote"
                        min="0"
                        max="20"
                        step="0.01"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-primary"
                >

                    <i class="fa-solid fa-pen"></i>

                    Modifier

                </button>

            </form>

        </section>



        <!-- =========================
             SUPPRIMER
        ========================== -->

        <section
            id="supprimerSection"
            class="section"
        >

            <h2>Supprimer une note</h2>


            <div class="search-box">

                <input
                    type="number"
                    id="noteId"
                    placeholder="ID de la note"
                >

                <button
                    id="btnDelete"
                    class="btn-danger"
                >

                    <i class="fa-solid fa-trash"></i>

                    Supprimer

                </button>

            </div>

        </section>



        <!-- =========================
             MOYENNE
        ========================== -->

        <section
            id="moyenneSection"
            class="section"
        >

            <h2>Calculer la moyenne</h2>


            <div class="search-box">

                <input
                    type="number"
                    id="studentMoyenne"
                    placeholder="ID de l'étudiant"
                >

                <button
                    id="btnCalculer"
                    class="btn-primary"
                >

                    <i class="fa-solid fa-calculator"></i>

                    Calculer

                </button>

            </div>


            <div id="resultatMoyenne"></div>

        </section>


    </main>


    <script src="/js/notes.js"></script>

</body>

</html>

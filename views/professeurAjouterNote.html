<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>School Manager - Ajouter une note</title>

    <link
        rel="stylesheet"
        href="/css/professeurAjouterNote.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>


<body>

    <aside class="Barre">

        <h2>School Manager</h2>

        <nav>

            <a href="/professeur">
                <i class="fa-solid fa-house"></i>
                <span>Accueil</span>
            </a>

            <a href="/professeur/matieres">
                <i class="fa-solid fa-book"></i>
                <span>Mes matières</span>
            </a>

            <a href="/professeur/etudiants">
                <i class="fa-solid fa-user-graduate"></i>
                <span>Étudiants</span>
            </a>

            <a
                href="/professeur/notes"
                class="active"
            >
                <i class="fa-solid fa-clipboard-list"></i>
                <span>Notes</span>
            </a>

            <a href="/professeur/absences">
                <i class="fa-solid fa-calendar-xmark"></i>
                <span>Absences</span>
            </a>

        </nav>


        <a
            href="/login"
            id="deconnecter"
        >

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>Déconnexion</span>

        </a>

    </aside>


    <main class="content">

        <div class="page-header">

            <div>

                <h1>Ajouter une note</h1>

                <p>
                    Enregistrer une note pour un étudiant.
                </p>

            </div>


            <button
                id="btnRetour"
                class="btn-retour"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Retour

            </button>

        </div>


        <section class="section">

            <h2>

                <i class="fa-solid fa-pen"></i>

                Nouvelle note

            </h2>


            <form id="noteForm">


                <div class="form-group">

                    <label for="student_id">
                        ID de l'étudiant
                    </label>

                    <input
                        type="number"
                        id="student_id"
                        min="1"
                        placeholder="Ex : 1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="subject_id">
                        ID de la matière
                    </label>

                    <input
                        type="number"
                        id="subject_id"
                        min="1"
                        placeholder="Ex : 2"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="note">
                        Note /20
                    </label>

                    <input
                        type="number"
                        id="note"
                        min="0"
                        max="20"
                        step="0.01"
                        placeholder="Ex : 15"
                        required
                    >

                </div>


                <div class="form-buttons">

                    <button
                        type="submit"
                        class="btn-primary"
                    >

                        <i class="fa-solid fa-check"></i>

                        Enregistrer

                    </button>


                    <button
                        type="button"
                        id="btnAnnuler"
                        class="btn-secondary"
                    >

                        Annuler

                    </button>

                </div>

            </form>

        </section>

    </main>


    <script src="/js/professeurAjouterNote.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion - School Manager</title>

    <link
        rel="stylesheet"
        href="/css/login.css"
    >

</head>


<body>

    <div class="login-container">

        <img
            src="/image/logo.png"
            alt="School Manager"
        >


        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Entrez votre email"
                required
            >


            <label for="password">
                Mot de passe
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Entrez votre mot de passe"
                required
            >


            <button type="submit">
                Se connecter
            </button>


            <p
                id="loginError"
                class="login-error"
            ></p>

        </form>


        <a href="/">
            Retour à l'accueil
        </a>

    </div>


    <script src="/js/login.js"></script>

</body>

</html>

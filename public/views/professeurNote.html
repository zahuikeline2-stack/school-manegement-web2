
<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>School Manager - Notes</title>

    <link
        rel="stylesheet"
        href="/css/professeurNote.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>


<body>


    <!-- ========================================
         BARRE LATERALE
    ========================================= -->

    <aside class="Barre">

        <h2>School Manager</h2>


        <nav>

            <a href="/professeur" class="active">

                <i class="fa-solid fa-house"></i>

                <span>Accueil</span>

            </a>


            <a href="/professeur/matieres">

                <i class="fa-solid fa-book"></i>

                <span>Matières</span>

            </a>


            <a href="/professeur/etudiants">

                <i class="fa-solid fa-user-graduate"></i>

                <span>Étudiants</span>

            </a>


            <a href="/professeur/notes">

                <i class="fa-solid fa-pen-to-square"></i>

                <span>Notes</span>

            </a>


            <a href="/professeur/absences">

                <i class="fa-solid fa-calendar-xmark"></i>

                <span>Absences</span>

            </a>

        </nav>


        <!-- DÉCONNEXION -->

        <a
            href="/login"
            id="deconnecter"
        >

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>Déconnexion</span>

        </a>

    </aside>




    <!-- ========================================
         CONTENU PRINCIPAL
    ========================================= -->

    <main class="content">


        <!-- EN-TÊTE -->

        <div class="page-header">

            <div>

                <h1>
                    Gestion des notes
                </h1>

                <p>
                    Ajouter ou modifier les notes des étudiants.
                </p>

            </div>


            <button
                type="button"
                id="btnRetour"
                class="btn-retour"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Retour

            </button>

        </div>



        <!-- ========================================
             BOUTONS D'ACTION
        ========================================= -->

        <div class="actions">


            <!-- AJOUTER UNE NOTE -->

            <button
                type="button"
                id="btnAjouter"
                class="action-card"
            >

                <div class="card-icon">

                    <i class="fa-solid fa-plus"></i>

                </div>


                <div>

                    <h3>
                        Ajouter une note
                    </h3>

                    <p>
                        Enregistrer une nouvelle note.
                    </p>

                </div>

            </button>



            <!-- MODIFIER UNE NOTE -->

            <button
                type="button"
                id="btnModifier"
                class="action-card"
            >

                <div class="card-icon">

                    <i class="fa-solid fa-pen-to-square"></i>

                </div>


                <div>

                    <h3>
                        Modifier une note
                    </h3>

                    <p>
                        Modifier une note existante.
                    </p>

                </div>

            </button>

        </div>



        <!-- ========================================
             SECTION AJOUTER
        ========================================= -->

        <section
            id="ajouterSection"
            class="section"
        >

            <h2>
                <i class="fa-solid fa-plus"></i>
                Ajouter une note
            </h2>


            <form id="ajouterForm">


                <!-- ÉTUDIANT -->

                <div class="form-group">

                    <label for="student_id">

                        ID de l'étudiant

                    </label>


                    <input
                        type="number"
                        id="student_id"
                        min="1"
                        placeholder="Ex : 1"
                        required
                    >

                </div>



                <!-- MATIÈRE -->

                <div class="form-group">

                    <label for="subject_id">

                        ID de la matière

                    </label>


                    <input
                        type="number"
                        id="subject_id"
                        min="1"
                        placeholder="Ex : 2"
                        required
                    >

                </div>



                <!-- NOTE -->

                <div class="form-group">

                    <label for="note">

                        Note /20

                    </label>


                    <input
                        type="number"
                        id="note"
                        min="0"
                        max="20"
                        step="0.01"
                        placeholder="Ex : 15.5"
                        required
                    >

                </div>



                <!-- BOUTONS -->

                <div class="form-buttons">

                    <button
                        type="submit"
                        class="btn-primary"
                    >

                        <i class="fa-solid fa-check"></i>

                        Enregistrer

                    </button>


                    <button
                        type="button"
                        id="annulerAjout"
                        class="btn-secondary"
                    >

                        Annuler

                    </button>

                </div>

            </form>

        </section>



        <!-- ========================================
             SECTION MODIFIER
        ========================================= -->

        <section
            id="modifierSection"
            class="section"
        >

            <h2>

                <i class="fa-solid fa-pen-to-square"></i>

                Modifier une note

            </h2>


            <form id="modifierForm">


                <!-- ÉTUDIANT -->

                <div class="form-group">

                    <label for="modifierStudent">

                        ID de l'étudiant

                    </label>


                    <input
                        type="number"
                        id="modifierStudent"
                        min="1"
                        placeholder="Ex : 1"
                        required
                    >

                </div>



                <!-- MATIÈRE -->

                <div class="form-group">

                    <label for="modifierSubject">

                        ID de la matière

                    </label>


                    <input
                        type="number"
                        id="modifierSubject"
                        min="1"
                        placeholder="Ex : 2"
                        required
                    >

                </div>



                <!-- NOUVELLE NOTE -->

                <div class="form-group">

                    <label for="nouvelleNote">

                        Nouvelle note /20

                    </label>


                    <input
                        type="number"
                        id="nouvelleNote"
                        min="0"
                        max="20"
                        step="0.01"
                        placeholder="Ex : 17"
                        required
                    >

                </div>



                <!-- BOUTONS -->

                <div class="form-buttons">

                    <button
                        type="submit"
                        class="btn-primary"
                    >

                        <i class="fa-solid fa-pen-to-square"></i>

                        Modifier

                    </button>


                    <button
                        type="button"
                        id="annulerModification"
                        class="btn-secondary"
                    >

                        Annuler

                    </button>

                </div>

            </form>

        </section>



        <!-- ========================================
             MESSAGE
        ========================================= -->

        <div
            id="message"
            class="message"
        ></div>


    </main>



    <!-- JAVASCRIPT -->

    <script src="/js/professeurNote.js"></script>


</body>

</html>

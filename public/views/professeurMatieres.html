```html
<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>School Manager - Mes matières</title>

    <link
        rel="stylesheet"
        href="/css/professeurMatieres.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>


<body>


    <!-- ========================================
         BARRE LATERALE
    ========================================= -->

    <aside class="Barre">

        <h2>School Manager</h2>


        <nav>

            <a href="/professeur" class="active">

                <i class="fa-solid fa-house"></i>

                <span>Accueil</span>

            </a>


            <a href="/professeur/matieres">

                <i class="fa-solid fa-book"></i>

                <span>Matières</span>

            </a>


            <a href="/professeur/etudiants">

                <i class="fa-solid fa-user-graduate"></i>

                <span>Étudiants</span>

            </a>


            <a href="/professeur/notes">

                <i class="fa-solid fa-pen-to-square"></i>

                <span>Notes</span>

            </a>


            <a href="/professeur/absences">

                <i class="fa-solid fa-calendar-xmark"></i>

                <span>Absences</span>

            </a>

        </nav>


        <!-- DÉCONNEXION -->

        <a
            href="/login"
            id="deconnecter"
        >

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>Déconnexion</span>

        </a>

    </aside>


    
    <!-- ========================================
         CONTENU
    ========================================= -->

    <main class="content">


        <div class="page-header">

            <div>

                <h1>Mes matières</h1>

                <p>
                    Voici les matières qui vous sont affectées.
                </p>

            </div>


            <button
                id="btnRetour"
                class="btn-retour"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Retour

            </button>

        </div>



        <!-- ========================================
             LISTE
        ========================================= -->

        <section class="section">

            <h2>

                <i class="fa-solid fa-book"></i>

                Liste de mes matières

            </h2>


            <div id="matieresList">

                <p class="loading">
                    Chargement des matières...
                </p>

            </div>

        </section>


    </main>



    <script src="/js/professeurMatieres.js"></script>

</body>

</html>
```

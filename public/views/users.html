<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gestion des utilisateurs - School Manager</title>

    <link
        rel="stylesheet"
        href="/css/users.css"
    >

</head>


<body>


    <!-- ========================================
         BARRE LATÉRALE
    ======================================== -->

    <aside class="Barre">

        <h2>School Manager</h2>


        <nav>

            <a href="/admin" id="retourAccueil">
                Accueil
            </a>

            <a href="/users" class="active">
                Utilisateurs
            </a>

            <a href="/etudiants" class="menu-admin">
                Étudiants
            </a>

            <a href="/professeurs" class="menu-admin">
                Professeurs
            </a>

            <a href="/matieres" class="menu-admin">
                Matières
            </a>

            <a href="/notes" class="menu-admin">
                Notes
            </a>

            <a href="/absences" class="menu-admin">
                Absences
            </a>

            <a href="/statistiques" class="menu-admin">
                Statistiques
            </a>

        </nav>


        <!-- ========================================
             DÉCONNEXION
        ======================================== -->

        <a
            href="/login"
            id="deconnecter"
            class="deconnecter"
        >
            Déconnexion
        </a>

    </aside>



    <!-- ========================================
         CONTENU PRINCIPAL
    ======================================== -->

    <main class="content">

        <h1>
            Gestion des utilisateurs
        </h1>


        <p>
            Ajouter, consulter et supprimer les utilisateurs.
        </p>



        <!-- ========================================
             ACTIONS
        ======================================== -->

        <div class="actions">

            <button
                type="button"
                id="btnAjouter"
            >
                Ajouter un utilisateur
            </button>


            <button
                type="button"
                id="btnLister"
            >
                Lister les utilisateurs
            </button>


            <button
                type="button"
                id="btnRetour"
            >
                Retour au menu
            </button>

        </div>



        <!-- ========================================
             FORMULAIRE
        ======================================== -->

        <section
            id="formulaireSection"
            class="section"
            style="display: none;"
        >

            <h2>
                Ajouter un utilisateur
            </h2>


            <form id="userForm">

                <label for="name">
                    Nom
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Nom de l'utilisateur"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Email de l'utilisateur"
                    required
                >


                <label for="password">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Mot de passe"
                    required
                >


                <label for="role">
                    Rôle
                </label>

                <select
                    id="role"
                    name="role"
                    required
                >

                    <option value="">
                        Choisir un rôle
                    </option>

                    <option value="admin">
                        Administrateur
                    </option>

                    <option value="professeur">
                        Professeur
                    </option>

                    <option value="etudiant">
                        Étudiant
                    </option>

                </select>


                <button type="submit">
                    Ajouter
                </button>

            </form>

        </section>



        <!-- ========================================
             LISTE
        ======================================== -->

        <section
            id="listeSection"
            class="section"
        >

            <h2>
                Liste des utilisateurs
            </h2>


            <div id="usersList">

                <p>
                    Cliquez sur
                    « Lister les utilisateurs »
                    pour afficher la liste.
                </p>

            </div>

        </section>

    </main>



    <script src="/js/users.js"></script>

</body>

</html>
